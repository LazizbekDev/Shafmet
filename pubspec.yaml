name: attendance_app
description: Xodimlarning ishga kelib-ketishini nazorat qilish ilovasi
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  camera: ^0.10.5+9
  google_mlkit_face_detection: ^0.10.0
  geolocator: ^11.0.0
  dio: ^5.4.3
  cupertino_icons: ^1.0.6
  camera_macos: ^0.0.9
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env
